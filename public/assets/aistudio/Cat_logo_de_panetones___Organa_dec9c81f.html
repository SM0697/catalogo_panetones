<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Catálogo de panetones · Organa</title>
    <style>
        :root {
            --bg: #f3f7f3;
            --card: #fff;
            --ink: #1c2a21;
            --muted: #5d6b62;
            --green: #1fae5b;
            --mint: #e4efe7;
            --line: #d5e3d9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #121a15;
                --card: #1a251e;
                --ink: #e8f1ea;
                --muted: #9db0a3;
                --green: #3fcf7d;
                --mint: #24352a;
                --line: #2d4034
            }
        }

        :root[data-theme="dark"] {
            --bg: #121a15;
            --card: #1a251e;
            --ink: #e8f1ea;
            --muted: #9db0a3;
            --green: #3fcf7d;
            --mint: #24352a;
            --line: #2d4034
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Manrope", "Segoe UI", Arial, sans-serif;
            line-height: 1.5
        }

        header {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 20px 8px
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin: 0 0 6px;
            letter-spacing: -.5px
        }

        header p {
            margin: 0;
            color: var(--muted)
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr))
        }

        .card {
            display: flex;
            gap: 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            align-items: stretch
        }

        .info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        .brand {
            color: var(--green);
            font-weight: 700;
            font-size: 14px;
            margin: 0 0 4px
        }

        .name {
            font-size: 20px;
            line-height: 1.2;
            margin: 0 0 12px;
            font-weight: 800
        }

        .lbl {
            font-weight: 700;
            margin: 0 0 6px;
            font-size: 14px
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 14px;
            display: grid;
            gap: 6px
        }

        li {
            display: flex;
            gap: 8px
        }

        .price {
            margin-top: auto;
            padding-top: 16px;
            font-size: 26px;
            font-weight: 800
        }

        .price.na {
            font-size: 15px;
            font-weight: 600;
            color: var(--muted)
        }

        .none {
            color: var(--muted);
            font-size: 14px;
            margin: 0
        }

        li::before {
            content: "";
            flex: 0 0 6px;
            height: 6px;
            margin-top: 8px;
            border-radius: 50%;
            background: var(--green)
        }

        .pic {
            flex: 0 0 42%;
            align-self: flex-start;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px
        }

        .pic img {
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 8px;
            display: block
        }

        @media(max-width:520px) {
            .card {
                flex-direction: column-reverse
            }

            .pic {
                flex-basis: auto
            }
        }

        footer {
            max-width: 1040px;
            margin: 0 auto;
            padding: 8px 20px 40px;
            color: var(--muted);
            font-size: 13px
        }
    </style>
</head>
